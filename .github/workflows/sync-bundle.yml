name: Sync Bundle

on:
  push:
    branches:
      - main

env:
  HUSKY: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - name: Embed scripts
        run: pnpm embed

      - name: Bundle Android
        run: |
          mkdir -p build/android
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/android/index.android.bundle \
            --assets-dest build/android

      - name: Bundle iOS
        run: |
          mkdir -p build/ios
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output build/ios/main.jsbundle \
            --assets-dest build/ios

      - name: Generate platform-specific package.json
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // Only keep hot-updater in devDependencies
          const hotUpdaterVersion = pkg.devDependencies['hot-updater'];
          pkg.devDependencies = {};
          if (hotUpdaterVersion) {
            pkg.devDependencies['hot-updater'] = hotUpdaterVersion;
          }

          // Remove fields not needed in target repos
          delete pkg.scripts;
          delete pkg['lint-staged'];

          // Dynamically generate modulesProvider from src/modules/*.ts
          const modulesDir = 'src/modules';
          const moduleFiles = fs.readdirSync(modulesDir).filter(f => f.endsWith('.ts'));
          const modulesProvider = {};
          for (const file of moduleFiles) {
            const name = path.basename(file, '.ts');
            modulesProvider[name] = 'RN' + name;
          }

          // iOS version
          const iosPkg = JSON.parse(JSON.stringify(pkg));
          iosPkg.codegenConfig = {
            name: 'RNNativeModuleSpec',
            type: 'modules',
            jsSrcsDir: 'modules',
            ios: { modulesProvider }
          };
          fs.writeFileSync('build/package.ios.json', JSON.stringify(iosPkg, null, 2) + '\n');

          // Android version
          const androidPkg = JSON.parse(JSON.stringify(pkg));
          androidPkg.codegenConfig = {
            name: 'RNNativeModuleSpec',
            type: 'modules',
            jsSrcsDir: 'modules',
            android: {
              javaPackageName: 'com.nowcent.ham.rn.nativemodule'
            }
          };
          fs.writeFileSync('build/package.android.json', JSON.stringify(androidPkg, null, 2) + '\n');
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-artifacts
          retention-days: 1
          path: |
            build/
            src/modules/

  sync-ios:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundle-artifacts

      - name: Sync to ham-ios
        env:
          DEPLOY_TOKEN: ${{ secrets.HAM_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/whu-ham/ham-ios.git /tmp/ham-ios
          cd /tmp/ham-ios
          git checkout master

          # Clean old bundle and assets
          rm -rf Ham/iOS/ui/rn/main.jsbundle
          rm -rf Ham/iOS/ui/rn/assets

          # Copy new bundle
          cp $GITHUB_WORKSPACE/build/ios/main.jsbundle Ham/iOS/ui/rn/main.jsbundle

          # Copy new assets
          if [ -d "$GITHUB_WORKSPACE/build/ios/assets" ]; then
            cp -r $GITHUB_WORKSPACE/build/ios/assets Ham/iOS/ui/rn/assets
          fi

          # Sync modules
          rm -rf Ham/iOS/ui/rn/modules
          cp -r $GITHUB_WORKSPACE/src/modules Ham/iOS/ui/rn/modules

          # Sync package.json and run pnpm install to generate lock file
          cp $GITHUB_WORKSPACE/build/package.ios.json Ham/iOS/ui/rn/package.json
          cd Ham/iOS/ui/rn
          pnpm install --no-frozen-lockfile
          cd /tmp/ham-ios

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: sync RN bundle from ham-rn@${GITHUB_SHA::7}" && git push origin master)

  sync-android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundle-artifacts

      - name: Sync to ham-android
        env:
          DEPLOY_TOKEN: ${{ secrets.HAM_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/whu-ham/ham-android.git /tmp/ham-android
          cd /tmp/ham-android
          git checkout master

          # Update bundle file
          mkdir -p android/app/src/main/assets
          cp $GITHUB_WORKSPACE/build/android/index.android.bundle android/app/src/main/assets/index.android.bundle

          # Sync resource files (only copy RN-generated drawable folders, don't replace entire res)
          if [ -d "$GITHUB_WORKSPACE/build/android/res" ]; then
            for dir in $GITHUB_WORKSPACE/build/android/res/drawable-*; do
              if [ -d "$dir" ]; then
                dir_name=$(basename "$dir")
                mkdir -p "android/app/src/main/res/$dir_name"
                cp -r "$dir"/* "android/app/src/main/res/$dir_name/"
              fi
            done
            # Also handle raw folder if exists
            if [ -d "$GITHUB_WORKSPACE/build/android/res/raw" ]; then
              mkdir -p android/app/src/main/res/raw
              cp -r $GITHUB_WORKSPACE/build/android/res/raw/* android/app/src/main/res/raw/
            fi
          fi

          # Sync modules
          rm -rf android/app/src/main/assets/modules
          cp -r $GITHUB_WORKSPACE/src/modules android/app/src/main/assets/modules

          # Sync package.json and run pnpm install to generate lock file
          cp $GITHUB_WORKSPACE/build/package.android.json android/app/src/main/assets/package.json
          cd android/app/src/main/assets
          pnpm install --no-frozen-lockfile
          cd /tmp/ham-android

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: sync RN bundle from ham-rn@${GITHUB_SHA::7}" && git push origin master)
