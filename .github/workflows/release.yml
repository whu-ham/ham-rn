name: Release

on:
  push:
    tags:
      - 'v*'

env:
  HUSKY: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle
        run: |
          pnpm bundle:android
          pnpm bundle:ios

      - name: Zip bundles
        run: |
          cd build/android && zip -r ../../android-bundle.zip . && cd ../..
          cd build/ios && zip -r ../../ios-bundle.zip . && cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android-bundle.zip
            ios-bundle.zip
