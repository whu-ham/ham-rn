name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm lint
      # `pnpm typecheck` runs `pnpm embed` first, which generates the embedded
      # score-calculator scripts under
      # src/business/education/scorecalc/embed/generated/. That directory is
      # gitignored, so without it tsc reports a missing-module error on a clean
      # checkout.
      - name: Run TypeScript
        run: pnpm typecheck
