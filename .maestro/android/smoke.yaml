appId: com.nowcent.ham.rndebug
name: Every registered screen boots inside the native container
tags:
  - smoke
---
# Verifies each AppRegistry entry loads without crashing. These screens have
# almost no UI to assert — RNCommon renders an empty View, and the two fetch
# screens show a spinner before calling back into native — so this is a
# crash check, not a behaviour check. See docs/e2e.md.
#
# The probe used to be "tap in, come back, shell still there", and it could not
# run in CI: the debug shell does not survive the pop. After returning from any
# RN screen the home list renders empty — reproduced with RNCommon, which makes
# no network calls at all, so it is not a network problem. The screenshot in the
# failures is a genuinely blank screen.
#
# So this no longer navigates back. Each screen is reached with its own launch
# rather than a back button, which still proves the entry boots with the embedded
# bundle — the actual point of a smoke check — without depending on a shell
# behaviour that is broken. Fixing the shell is a separate change, tracked in
# docs/e2e.md.
#
# How each launch is done matters, and was got wrong once:
#
#   - `clearState: true` is what returns the app to the shell. A bare
#     `launchApp` only brings the app to the foreground, so the second entry
#     would be reached while the previous RN screen is still showing, and the
#     shell entry to tap is not on screen.
#   - Do NOT use `stopApp: true` here. It terminates the app first, and on CI
#     that terminate hung for ~135s and took the whole XCUITest driver session
#     down with it — the flow then failed on its first assertion with no UI at
#     all, which reads like a broken screen rather than a stuck teardown.
#     `killApp` + `clearState` resets cleanly without the terminate.
#
# We deliberately do not assert on 'Loading': it is an i18next string, and the
# app's language comes from NativeCommonModule.getLocale() (device locale), so
# it flakes on any device that is not set to English.

# ScoreCalcView is the only screen with real content, so it also asserts its two
# hardcoded script titles.
- launchApp:
    appId: 'com.nowcent.ham.rndebug'
    clearState: true
- extendedWaitUntil:
    visible: 'RNScoreCalcView'
    timeout: 60000
- tapOn: 'RNScoreCalcView'
- extendedWaitUntil:
    visible: '计算机学院综测计算（F2）'
    timeout: 60000
- extendedWaitUntil:
    visible: '社会学院综测计算（F2）'
    timeout: 60000

# The rest render a spinner or nothing, so the only assertion available is that
# the entry name resolved and the screen came up.
- killApp:
    appId: 'com.nowcent.ham.rndebug'
- launchApp:
    appId: 'com.nowcent.ham.rndebug'
    clearState: true
- extendedWaitUntil:
    visible: 'RNCommon'
    timeout: 60000
- tapOn: 'RNCommon'

- killApp:
    appId: 'com.nowcent.ham.rndebug'
- launchApp:
    appId: 'com.nowcent.ham.rndebug'
    clearState: true
- extendedWaitUntil:
    visible: 'RNFetchScoreView'
    timeout: 60000
- tapOn: 'RNFetchScoreView'

- killApp:
    appId: 'com.nowcent.ham.rndebug'
- launchApp:
    appId: 'com.nowcent.ham.rndebug'
    clearState: true
- extendedWaitUntil:
    visible: 'RNFetchCourseViewE2E'
    timeout: 60000
- tapOn: 'RNFetchCourseViewE2E'
